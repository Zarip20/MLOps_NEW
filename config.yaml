# ==========================================================================
# Конфигурация MLOps-конвейера.
#
# Единственный источник истины: ни пути, ни пороги, ни гиперпараметры
# не заданы в коде. Файл проверяется при старте — неизвестные ключи
# секций, неверные типы и выход за диапазоны приводят к понятной ошибке,
# а не к сбою в середине прогона.
#
# Числовые значения порогов и правил выбраны по результатам профилирования
# всех 48 батчей (508 499 строк). Обоснования — в PLAN.md, §1.2 и §1.8.
# ==========================================================================

# --------------------------------------------------------------------------
# Общие настройки прогона
# --------------------------------------------------------------------------
run:
  seed: 42                      # воспроизводимость обучения и разбиения
  log_level: INFO
  log_file: training.log

# --------------------------------------------------------------------------
# Пути. Относительные пути разрешаются от корня проекта, поэтому запуск
# не зависит от текущего рабочего каталога.
# --------------------------------------------------------------------------
paths:
  source_zip: data/motor_data14-2018.zip
  source_csv: data/motor_data14-2018.csv
  data_raw: data/raw_batches
  data_processed: data/processed
  models: models
  reports: reports
  metadata: data/metadata
  rules_file: data/rules.json
  state_file: state.json
  site: site                      # собранный статический сайт для GitHub Pages

# --------------------------------------------------------------------------
# Источники данных (1.b.ii)
#
# Их может быть несколько: все приводятся к общему контракту (архив или
# CSV, своё имя, свой префикс имён батчей) и складываются в один поток с
# общей схемой колонок и общей целевой меткой. Требование к источникам
# одно: у всех должны быть те же колонки, иначе это были бы разные
# задачи, а не один поток.
#
# Если секция не задана, работает пара `paths.source_zip` /
# `paths.source_csv` — прежнее поведение, на котором накоплены все
# артефакты проекта.
#
# `prefix` обязателен, когда источников больше одного: два набора за один
# и тот же месяц переписали бы друг друга. При совпадении префиксов
# конвейер откажется работать.
#
# `share` — доля источника в потоке, доля единицы. Сообщается в лог и в
# манифест: по нему видно, каким был состав потока.
# --------------------------------------------------------------------------
sources:
  - name: ethiopian
    path: data/motor_data14-2018.zip
    extracted_to: data/motor_data14-2018.csv
    prefix: batch_
    share: 1.0
    enabled: true

# --------------------------------------------------------------------------
# Разбиение на батчи
# --------------------------------------------------------------------------
batching:
  size: month                    # month | quarter | year
  time_column: INSR_BEGIN
  date_format: "%d-%b-%y"

  # Дополнительные колонки исходника, которые сохраняются в кадре
  # конвейера, хотя не являются признаками. `INSR_END` нужен для
  # расчёта длительности полиса: без него производный признак
  # вычислялся бы при инференсе (где доступен весь файл), но не при
  # обучении, где кадр урезан до признаков.
  context_columns:
    - INSR_END

# Обязательные колонки в каждом батче. Проверяются при чтении, чтобы
# изменение схемы источника обнаруживалось сразу, а не через KeyError
# в середине обучения.
schema:
  required_columns:
    - SEX
    - INSR_BEGIN
    - INSR_END
    - INSR_TYPE
    - INSURED_VALUE
    - PREMIUM
    - PROD_YEAR
    - SEATS_NUM
    - CARRYING_CAPACITY
    - TYPE_VEHICLE
    - MAKE
    - USAGE
    - CLAIM_PAID

  # Колонки источника, которые обязаны быть числовыми. Проверяются шире,
  # чем признаки: повреждённые значения в этом наборе лежат в EFFECTIVE_YR
  # (640 записей нечислового мусора вида `1C`, `4A`, `/2`), а колонка не
  # является признаком. Проверка только признаков её бы пропустила.
  expected_numeric:
    - INSURED_VALUE
    - PREMIUM
    - PROD_YEAR
    - SEATS_NUM
    - CARRYING_CAPACITY
    - CCM_TON
    - EFFECTIVE_YR
    - INSR_TYPE
    - OBJECT_ID

# --------------------------------------------------------------------------
# Целевая метка
# --------------------------------------------------------------------------
target:
  column: CLAIM_PAID            # 1, если значение заполнено
  name: HAS_CLAIM
  positive_rule: notna

# --------------------------------------------------------------------------
# Признаки
#
# Объект OBJECT_ID (уникальный идентификатор) и даты INSR_BEGIN/INSR_END
# намеренно исключены: первые позволяют выучить идентификатор вместо
# риска, вторые — время появления полиса, что даёт утечку в потоковой
# постановке.
#
# INSURED_VALUE == 0 встречается у 45.5 % записей и трактуется как
# значимое значение, а не как пропуск (решение Р-2), поэтому нижняя
# граница 0, а не строгое неравенство.
# --------------------------------------------------------------------------
features:
  numerical:
    - INSURED_VALUE
    - PREMIUM
    - PROD_YEAR
    - SEATS_NUM
    - CARRYING_CAPACITY
  categorical:
    - SEX
    - INSR_TYPE
    - TYPE_VEHICLE
    - MAKE
    - USAGE

# --------------------------------------------------------------------------
# Оценка качества данных и очистка
# --------------------------------------------------------------------------
quality:

  # Порог доли пропусков в строке, выше которого строка удаляется.
  # Наблюдаемое максимальное значение по всем батчам — 0.3125, поэтому
  # порог 0.25 срабатывает редко (62 строки на 508 499), но срабатывает,
  # то есть механизм работает и виден в отчёте.
  max_row_missing_ratio: 0.25

  # Максимальная доля нарушений, при которой правило качества
  # действительно применяется. Если правило нарушается сильнее, оно
  # считается настроенным неверно для этих данных: массовое удаление
  # уничтожило бы датасет. Такое правило помечается в отчёте как
  # неприменённое вместе с фактической долей.
  max_violation_ratio: 0.1

  # Правила. Каждое — данные, а не исполняемый код: условие задаётся
  # полями column/op/value, что позволяет проверить конфигурацию и
  # показать правило в отчёте человекочитаемо.
  #
  # Поле on_missing различает две разные вещи, которые прежний код
  # смешивал: пропуск в PREMIUM — это неполнота (её считает метрика
  # completeness, а значение восстановит SimpleImputer), тогда как
  # пропуск грузоподъёмности у грузового автомобиля — настоящее
  # нарушение, потому что грузоподъёмность для него обязательна.
  rules:
    - name: premium_non_negative
      description: PREMIUM не может быть отрицательным
      column: PREMIUM
      op: ge
      value: 0
      on_missing: ignore
      severity: error

    - name: insured_value_non_negative
      description: INSURED_VALUE не может быть отрицательным
      column: INSURED_VALUE
      op: ge
      value: 0
      on_missing: ignore
      severity: error

    - name: prod_year_in_range
      description: PROD_YEAR в диапазоне 1900..2025
      column: PROD_YEAR
      op: between
      value: [1900, 2025]
      on_missing: ignore
      severity: error

    - name: seats_non_negative
      description: SEATS_NUM не может быть отрицательным
      column: SEATS_NUM
      op: ge
      value: 0
      on_missing: ignore
      severity: error

    # Правило для грузовых автомобилей. В исходной конфигурации здесь стояло
    # 'truck' строчными, тогда как в данных значение — 'Truck', поэтому
    # правило не срабатывало ни на одном из 48 батчей.
    # С проверенными данными: грузовые типы — Truck, Trailers and
    # semitrailers, Tanker (122 079 записей), из них 35 573 (7.00 % всего
    # набора) имеют пустую или нулевую грузоподъёмность. Доля 7.00 % ниже
    # порога 0.1, поэтому очистка применяется (решение Р-1: удаление
    # считается корректным).
    - name: cargo_capacity_required
      description: Для грузовых ТС грузоподъёмность должна быть заполнена и больше нуля
      column: CARRYING_CAPACITY
      op: gt
      value: 0
      on_missing: violation
      severity: error
      applies_when:
        column: TYPE_VEHICLE
        op: in
        value: ["Truck", "Trailers and semitrailers", "Tanker"]

  # Параметры поиска ассоциативных правил.
  #
  # Отбор идёт по lift, а не по confidence: в baseline-прогоне отбор по
  # уверенности дал пять правил с confidence = 1.0, и все пять — в сторону
  # мажоритного класса INSR_TYPE = 1202 (76 % данных). Lift показывает,
  # во сколько раз правило сильнее случайного совпадения, и потому
  # не «выбирает» частый класс. Дополнительно следствия, совпадающие с
  # самым частым значением своей колонки, отбрасываются как тривиальные.
  association:
    algorithm: fpgrowth          # fpgrowth | apriori; в mlxtend fpgrowth в 3–6 раз быстрее
    min_support: 0.01
    min_confidence: 0.5
    min_lift: 1.2
    max_len: 2                   # без ограничения длины набора возможен комбинаторный рост
    n_rules: 5
    exclude_majority_consequent: true

    # Минимальное число строк под антецендентом, при котором доля нарушений
    # вообще показана в отчёте. Правило, совпавшее с одной-двумя строками
    # малого батча, даёт «100 % нарушений», что ничего не говорит о
    # качестве данных: в прогоне без этого порога наблюдались значения
    # violation_ratio = 1.0 при antecedent_rows = 1.
    min_antecedent_rows: 30

# --------------------------------------------------------------------------
# Предобработка
# --------------------------------------------------------------------------
preprocessing:
  numeric_imputer: median
  categorical_imputer: most_frequent
  scaler: standard              # standard | robust | none

  # Ограничение числа категорий. 0 — использовать все. MAKE содержит 747
  # значений, и они фиксируются на первом батче, поэтому редкие марки из
  # поздних батчей схлопываются в нули. Ненулевое значение собирает
  # категории в группу «редкие» (min_frequency/top_k).
  make_top_k: 0
  top_k_columns: ["MAKE"]

  # Перебор вариантов предобработки (3.b.i). Победитель становится
  # основной конфигурацией, результаты — в отчёт и манифест.
  #
  # Ограничение, о котором стоит знать: перебор идёт на ОДНОЙ дешёвой
  # модели (`lr`) и на том батче, где запускается. Дерево, лес и
  # нейросеть реагируют на масштаб и импутацию иначе, поэтому выбор по
  # одной линейной модели не переносится на них автоматически. Зато
  # полный перебор всех моделей по всем вариантам умножил бы время
  # прогона на их число. Что́ именно выбиралось и на чём — видно в
  # отчёте, в таблице вариантов.
  sweep:
    enabled: true
    # Батч, на котором запускается перебор. Препроцессор обучается заново
    # только там, и там же выбор влияет на всё последующее обучение.
    first_batch: 0
    # 0 — только на первом батче. Положительное число — ещё и на каждом
    # N-м после него.
    every_n_batches: 0
    # Модель, по которой выбирается вариант.
    model: lr
    # Метрика выбора. Совпадает с метрикой отбора продуктовой модели,
    # иначе перебор улучшал бы одно, а реестр выбирал бы по другому.
    metric: f1

  # Варианты для перебора. Список задан явно, а не строится декартовым
  # произведением: часть комбинаций заведомо бессмысленна, а полный
  # перебор на 48 батчах занял бы больше времени, чем всё обучение.
  # Первый вариант совпадает с базовой конфигурацией — это точка отсчёта,
  # без которой остальные цифры не с чем сравнить.
  variants:
    - name: median_standard
      numeric_imputer: median
      scaler: standard
      make_top_k: 0
    - name: mean_standard
      numeric_imputer: mean
      scaler: standard
      make_top_k: 0
    - name: median_robust
      numeric_imputer: median
      scaler: robust
      make_top_k: 0
    - name: median_standard_top50
      numeric_imputer: median
      scaler: standard
      make_top_k: 50
    - name: mean_robust_top50
      numeric_imputer: mean
      scaler: robust
      make_top_k: 50

# --------------------------------------------------------------------------
# Модели
#
# Общие настройки: обучение с нуля и дообучение, использование
# накопительного хранилища, стратегия компенсации дисбаланса.
# --------------------------------------------------------------------------
models:

  # Набор намеренно разнородный по устойчивости — это требование 4.b.ii
  # («несколько моделей с различной устойчивостью к входным данным»).

  # Логистическая регрессия: почти не требует настройки, устойчива,
  # даёт коэффициенты для интерпретации.
  lr:
    C: 1.0
    max_iter: 1000
    class_weight: balanced
    random_state: 42
    partial_fit: false
    use_store: true

  # Дерево решений: ловит нелинейности и взаимодействия, но склонно
  # переобучаться на дисбалансе.
  dt:
    # Переобучается с нуля на накопленных данных (пункт 4.1 задания).
    max_depth: 10
    min_samples_split: 20
    min_samples_leaf: 10
    class_weight: balanced
    random_state: 42
    use_store: true

  # Ансамбль деревьев: устойчивее одиночного дерева, заметно медленнее.
  rf:
    n_estimators: 60
    max_depth: 12
    min_samples_split: 20
    min_samples_leaf: 5
    class_weight: balanced_subsample
    n_jobs: -1
    random_state: 42
    use_store: true

  mlp:
    hidden_layer_sizes: [50, 25]
    activation: relu
    solver: adam
    learning_rate_init: 0.001
    alpha: 0.0001
    max_iter: 300
    shuffle: true
    random_state: 42

    # warm_start обязан быть false при partial_fit: true — прогресс
    # оптимизатора при partial_fit не переиспользуется, и оставление
    # warm_start включённым вводит в заблуждение. Проверка есть в
    # src/config.py.
    warm_start: false

    # partial_fit — режим дообучения без обучения с нуля (пункт 4.b.i).
    partial_fit: true
    # Число эпох на батч. В исходной конфигурации эпоха была одна на
    # весь батч, из-за чего сеть не обучалась: в baseline f1 упала
    # до 0.000 к третьему батчу.
    epochs_per_batch: 5
    # Дисбаланс компенсируется весами образцов: у MLPClassifier нет
    # параметра class_weight, но partial_fit принимает sample_weight.
    balancing: balanced         # balanced | sqrt | none
    use_store: false

# --------------------------------------------------------------------------
# Гейт качества (АР-5)
#
# Решает, достоин ли кандидат стать продуктовой моделью. Без него
# «контроль качества» сводился бы к argmax по f1, и гейт закрепил бы
# за продуктом посредственную модель, случайно оказавшуюся лучше на
# одном батче. Правила, которых здесь нет, не применяются.
# --------------------------------------------------------------------------
quality_gate:
  # Продуктовая модель переключается только на лучшую по f1.
  promote_best_by_f1: true
  # Минимально допустимое качество кандидата.
  min_f1: 0.05
  min_roc_auc: 0.60
  # Допустимое падение f1 относительно текущей продуктовой версии.
  max_regression_f1: 0.15
  # Порог дрейфа, при котором версия в продуктив не выводится.
  #
  # Порог выше «учебных» 0.25 сознательно и опирается на измерения.
  # В этом наборе выражена сезонность: доля страховых случаев в июле —
  # 11 %, в феврале — 5 %, а доля грузовых типов кузова меняется от
  # месяца к месяцу. Поэтому PSI между соседними месяцами по числовым
  # признакам держится в диапазоне 0.15…0.45, и порог 0.25 помечал бы
  # alert на большинстве батчей, не различая норму и аномалию.
  #
  # Роль порога — отмечать действительно сильный сдвиг, а не сезонный
  # ход. Сезонный и трендовый сдвиг целевой метки (−78 % за 4 года)
  # отслеживается отдельно: это `target.psi` и `target.relative_change`
  # в метаданных, а также отдельный раздел отчёта и дашборда.
  max_psi: 0.45

# --------------------------------------------------------------------------
# Хранение версий моделей
# --------------------------------------------------------------------------
registry:
  # Сколько последних версий каждой модели держать файлами на диске.
  #
  # Записи реестра (метрики, статус, причина отклонения, дата) при
  # этом остаются все: история версий по батчам и есть требование о
  # хранении метрик. Удаляются только файлы — у них нет отдельной
  # ценности, кроме возможности откатиться на конкретный батч.
  #
  # Число подобрано по факту, а не на глаз. На каждом батче создаётся
  # четыре версии, и на 48 батчах каталог `models/` вырастает примерно
  # до 160 МБ, из которых 145 МБ — случайный лес (около 3 МБ на
  # версию). В CI такой каталог уходит и в кэш состояния, и в
  # артефакты при каждом запуске. Пять последних версий на модель —
  # это и история для сравнения, и около 20 МБ вместо 160.
  #
  # Продуктовая версия не удаляется никогда, даже если она старше
  # всех остальных: на неё ссылается инференс.
  keep_artifacts_per_model: 5

# --------------------------------------------------------------------------
# Мониторинг дрейфа (2.b.iv, 5.b.ii)
#
# Доля страховых случаев падает с 11.0 % до 2.4 % за 48 батчей, поэтому
# без контроля дрейфа падение f1 выглядит как «модель испортилась» и
# лечится переобучением, которое не помогает: изменились данные.
# --------------------------------------------------------------------------
drift:
  enabled: true

  # Сколько батчей входит в скользящее окно эталона. Эталон не должен
  # быть «заморожен» на первом батче: иначе естественный сдвиг 2014 → 2018
  # выглядел бы постоянной аномалией. Значение 12 соответствует одному
  # году и повторяет сезонный цикл — на этом наборе изменение окна
  # между 1 и 12 батчами существенно PSI не меняет, потому что разброс
  # определяется сезонностью, а не длиной истории.
  reference_window: 12
  # Пороги PSI по числовым признакам. См. пояснение к `quality_gate.max_psi`:
  # значения подобраны по фактическому распределению PSI на этом наборе,
  # где сезонность даёт 0.15…0.45 между соседними месяцами.
  psi_warn: 0.25
  psi_alert: 0.45
  ks_warn: 0.20

  # Доля значений категории, которых не было в эталоне, начиная с которой
  # это отмечается в отчёте.
  new_category_share_warn: 0.01

  # PSI по категориальным признакам выключен: на проверенных данных он
  # давал 0.98 для колонки SEX с тремя значениями и неизменными долями.
  # Категории отслеживаются по появлению новых значений.
  categorical_psi: false

# --------------------------------------------------------------------------
# Автоматический EDA (2.b.i)
# --------------------------------------------------------------------------
eda:
  enabled: true

# --------------------------------------------------------------------------
# Feature Engineering (2.b.ii)
#
# Производные признаки вычисляются до предобработки и потому проходят
# через тот же ColumnTransformer. Состав фиксируется на первом батче:
# если бы он менялся, изменилась бы ширина матрицы и сломался бы
# partial_fit.
# --------------------------------------------------------------------------
feature_engineering:
  enabled: true

# --------------------------------------------------------------------------
# Интерпретация моделей (5.b.i)
# --------------------------------------------------------------------------
explain:
  enabled: true

# --------------------------------------------------------------------------
# Валидация
#
# Разделение выполняется ДО обучения, поэтому валидационная часть
# никогда не участвует в обучении. В исходном коде train_test_split
# вызывался после обучения на полной матрице, и метрики считались на
# обучающих данных.
# --------------------------------------------------------------------------
validation:
  strategy: stream_holdout
  test_size: 0.2
  stratify: true                # сохраняет долю положительного класса в обеих частях
  random_state: 42
  min_positive_samples: 50      # ниже порога стратификация может быть отключена

# --------------------------------------------------------------------------
# Накопительное хранилище обучающих данных
#
# Хранит только train-части батчей: валидационные строки не сохраняются
# никогда, иначе на следующих батчах они попадут в обучение.
# --------------------------------------------------------------------------
training_store:
  enabled: true
  path: data_processed
  window: null                  # null — вся история; число — последние N батчей

# --------------------------------------------------------------------------
# Устойчивый инференс (6.b.ii)
#
# Здесь описано, что делать с входными данными, которые не обязаны быть
# такими же, как обучающие, и как переводить вероятности в решения.
# --------------------------------------------------------------------------
inference:
  # Проверка входа перед прогнозом.
  validate:
    # Доля выбросов за обучающим диапазоном, выше которой файл
    # считается аномалией и не прогнозируется вовсе.
    max_outlier_ratio: 0.2
    # Проверять, не встречаются ли значения категорий, которых не было
    # при обучении. Такие значения схлопываются one-hot-кодировщиком в
    # нули, и строка тихо получает «средний» вклад.
    check_categories: true

  # Порог принятия решения.
  #
  # `quantile` означает: порог подбирается под заданную долю положительных
  # решений. Это нужно потому, что f1 максимизирует recall, а дисбаланс
  # компенсируется весами, и модели предсказывают положительный класс в
  # 34…69 % строк при фактических 6,6 % (замерено на 48 батчах, см.
  # отчёт, раздел 10). Порог 0,5 на этих данных даёт тот же брак.
  #
  # `fixed` оставляет обычный порог — режим для сравнения.
  threshold_mode: quantile

  # Доля положительных решений. `auto` берётся из последних прогонов —
  # доля падает с 11 % до 2,4 %, и фиксированное число устарело бы.
  target_positive_rate: auto

  # Резервная модель: используется, если продуктовая неприменима.
  # Логистическая регрессия выбрана как самая устойчивая к аномалиям
  # входа из четырёх имеющихся.
  fallback_model: lr

# --------------------------------------------------------------------------
# Meta Learning (7.b.iii)
#
# Анализ накопленных прогонов: что действительно влияло на качество.
# Результат — reports/meta.json, читается при `-mode summary`.
#
# В прогоне гиперпараметры заданы один раз и не меняются, поэтому по
# постоянным настройкам их влияние не оценивается — и анализ так и
# пишет, вместо того чтобы выдавать правдоподобную, но бессмысленную
# «важность». Оценивается то, что меняется само: объём накопленных
# данных, достигнутое число итераций, режим обучения, доля положительного
# класса, номер батча.
# --------------------------------------------------------------------------
meta_learning:
  # Метрика, по которой ищется влияние. Продуктовая модель выбирается
  # по f1, и вывод о влиянии на другую метрику отвечал бы на другой
  # вопрос, чем тот, который задаётся реестром.
  metric: f1

  # Начиная с какого числа батчей выводы считаются обоснованными. На
  # двух батчах разницу между группами не видно, и утверждать её —
  # значит выдумывать результат.
  min_batches: 3

# --------------------------------------------------------------------------
# Поведение конвейера
# --------------------------------------------------------------------------
pipeline:
  # Сколько батчей обрабатывать за один вызов `-mode update`, если не
  # указан ключ -n. Один полный прогон 48 батчей занимает около минуты,
  # однако в CI по умолчанию обрабатывается 12 (решение Р-3): приоритет —
  # корректная работоспособность, а полный прогон доступен через -n 48.
  default_batches: 12
